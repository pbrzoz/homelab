services:
  drawio:
    image: jgraph/drawio
    container_name: drawio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /usr/local/tomcat/logs
      - /usr/local/tomcat/temp
      - /usr/local/tomcat/work
      - /usr/local/tomcat/conf/Catalina
    networks:
      - proxy
    labels:
      - "traefik.enable=true"      
      - "traefik.http.routers.drawio.entrypoints=https"
      - "traefik.http.routers.drawio.middlewares=default-chain@file,authentik@file"
      - "traefik.http.services.drawio.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
