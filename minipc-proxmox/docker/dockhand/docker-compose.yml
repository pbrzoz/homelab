services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s   
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      # Required for Dockhand core functionality
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - EVENTS=1
      - POST=1
      - DELETE=1
      # Required for dashboard host info and disk usage
      - INFO=1
      - SYSTEM=1
      # Required for vulnerability scanning
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Required to view container logs, AND for vulnerability scanning:
      # Dockhand reads the scanner container's output through the logs API
      - ALLOW_LOGS=1
      # Optional: enable for the container terminal, volume browsing,
      # and the in-container file browser (all use the Docker exec API)
      # - EXEC=1
      # Optional: enable if you use Backups behind the proxy (the backup
      # helper streams files via the archive API)
      # - ALLOW_ARCHIVE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
  
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    depends_on:
      - socket-proxy
    user: ${UID}:${GID}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/data
      - ${DOCKER_STACKS_PATH}:${DOCKER_STACKS_PATH}
    networks:
      - socket-proxy
      - proxy
    labels:
      - "traefik.enable=true"      
      - "traefik.http.routers.dockhand.entrypoints=https"
      - "traefik.http.routers.dockhand.middlewares=default-chain@file,local-whitelist@file"
      - "traefik.http.services.dockhand.loadbalancer.server.port=3000"

networks:
  socket-proxy:
    internal: true
  proxy:
    external: true
