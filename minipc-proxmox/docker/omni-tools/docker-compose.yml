services:
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "${UID:-1000}:${GID:-1000}"
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777,uid=${UID:-1000},gid=${GID:-1000}
      - /var/run:mode=1777
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omnitools.entrypoints=https"
      - "traefik.http.routers.omnitools.middlewares=default-chain@file,authentik@file"
      - "traefik.http.services.omnitools.loadbalancer.server.port=80"

networks:
  proxy:
    external: true