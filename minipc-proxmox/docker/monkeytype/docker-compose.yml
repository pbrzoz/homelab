services:
  monkeytype:
    image: themythologist/monkeytype:frontend-latest
    container_name: monkeytype
    hostname: monkeytype
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /root/.npm
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monkeytype.entrypoints=https"
      - "traefik.http.routers.monkeytype.middlewares=default-chain@file"
      - "traefik.http.services.monkeytype.loadbalancer.server.port=5000"

networks:
  proxy:
    external: true
