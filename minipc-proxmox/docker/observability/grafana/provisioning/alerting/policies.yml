apiVersion: 1

policies:
  - orgId: 1
    receiver: homelab-default
    group_by: [alertname, severity]
    group_wait: 1m
    group_interval: 5m
    # A homelab alert that is still firing does not need to be re-sent every 4 hours;
    # once a day is enough to remind without becoming background noise.
    repeat_interval: 24h
    routes:
      - receiver: homelab-default
        object_matchers:
          - [severity, "=", "critical"]
        group_wait: 30s
        repeat_interval: 6h
