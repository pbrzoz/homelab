apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # fixed uid: the provisioned alert rules reference it by name
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s      # must match global scrape_interval so $__rate_interval is sane
      httpMethod: POST
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: TraceID
          matcherRegex: '"RequestID":"([^"]+)"'
          url: ''
