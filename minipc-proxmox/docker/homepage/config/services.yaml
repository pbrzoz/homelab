---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services

- Services:
    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.DOMAIN.TLD
        widget:
            type: proxmox
            url: https://PROXMOX_IP:8006
            username: {{HOMEPAGE_FILE_PROXMOX_USERNAME}}
            password: {{HOMEPAGE_FILE_PROXMOX_PASSWORD}}
            node: myproxmox
    - Traefik:
        icon: traefik.png
        href: https://traefik-dashboard.DOMAIN.TLD
        server: my-docker
        container: traefik
        widget:
            type: traefik
            url: https://traefik-dashboard.DOMAIN.TLD
            username: {{HOMEPAGE_FILE_TRAEFIK_USERNAME}}
            password: {{HOMEPAGE_FILE_TRAEFIK_PASSWORD}}
    - Calibre:
        icon: sh-calibre-web.png
        href: https://calibre.DOMAIN.TLD        
        server: my-docker
        widget:
            type: calibreweb
            url: https://calibre.DOMAIN.TLD
            username: {{HOMEPAGE_FILE_CALIBRE_USERNAME}}
            password: {{HOMEPAGE_FILE_CALIBRE_PASSWORD}}
    - Changedetection:
        icon: changedetection.png
        href: https://changedetection.DOMAIN.TLD
        container: changedetection
        server: my-docker
        widget:
            type: changedetectionio
            url: http://changedetection:5000
            key: {{HOMEPAGE_FILE_CHANGEDETECTION}}
    - Mealie:
        icon: mealie.png
        href: https://mealie.DOMAIN.TLD
        container: mealie
        server: my-docker
        widget:
            type: mealie
            url: https://mealie.DOMAIN.TLD
            key: {{HOMEPAGE_FILE_MEALIE}}
            version: 2
    - Adguard Home:
        icon: adguard-home.png
        href: http://ADGUARD_IP
        widget:
            type: adguard
            url: http://ADGUARD_IP
            username: {{HOMEPAGE_FILE_ADGUARD_USERNAME}}
            password: {{HOMEPAGE_FILE_ADGUARD_PASSWORD}}
    - Karakeep:
        icon: karakeep.png
        href: https://karakeep.DOMAIN.TLD
        container: karakeep
        server: my-docker
        widget:
            type: karakeep
            url: https://karakeep.DOMAIN.TLD
            key: {{HOMEPAGE_FILE_KARAKEEP}}

