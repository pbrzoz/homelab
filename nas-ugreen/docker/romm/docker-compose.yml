services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - DB_HOST=romm-db
      - DB_NAME=${DATABASE} # Should match MARIADB_DATABASE in mariadb
      - DB_USER=${USER} # Should match MARIADB_USER in mariadb
      - DB_PASSWD=${ROMM_PASSWORD} # Should match MARIADB_PASSWORD in mariadb
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY} # Generate a key with `openssl rand -hex 32`
      - SCREENSCRAPER_USER= # These are the recommended metadata providers
      - SCREENSCRAPER_PASSWORD= # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#screenscraper
      - RETROACHIEVEMENTS_API_KEY= # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#retroachievements
      - STEAMGRIDDB_API_KEY= # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#steamgriddb
      - HASHEOUS_API_ENABLED=true # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
      - OIDC_ENABLED=true
      - OIDC_PROVIDER=authentik
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=https://romm.${DOMAIN}/api/oauth/openid
      - OIDC_SERVER_APPLICATION_URL=https://auth.${DOMAIN}/application/o/romm
      - DISABLE_USERPASS_LOGIN=true
      - OIDC_AUTOLOGIN=true
      - OIDC_CLAIM_ROLES=${OIDC_CLAIM_ROLES}
      - OIDC_ROLE_VIEWER=${OIDC_ROLE_VIEWER}
      - OIDC_ROLE_ADMIN=${OIDC_ROLE_ADMIN}
      - TZ=${TIMEZONE}
    volumes:
      - ${LIBRARY_PATH}/resources:/romm/resources # Resources fetched from IGDB (covers, screenshots, etc.)
      - ./data/data:/redis-data # Cached data for background tasks
      - ${LIBRARY_PATH}/library:/romm/library # Your game library. Check https://docs.romm.app/latest/Getting-Started/Folder-Structure/ for more details.
      - ${LIBRARY_PATH}/assets:/romm/assets # Uploaded saves, states, etc.
      - ./data/config:/romm/config # (Optional) Path where config.yml is stored
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    networks:
      - romm
    ports:
      - 9980:8080

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    networks:
      - romm
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD} # Use a unique, secure password
      - MARIADB_DATABASE=${DATABASE}
      - MARIADB_USER=${ROMM_USER}
      - MARIADB_PASSWORD=${ROMM_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  romm: